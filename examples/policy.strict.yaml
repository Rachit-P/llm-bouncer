# llm-bouncer STRICT policy example. Only the keys set here change; everything else keeps the
# default. Use it with LLM_BOUNCER_POLICY=/path/to/policy.strict.yaml or copy it to
# ~/.llm-bouncer/policy.yaml.
#
# File and command output also taint the session, which catches injections planted in repo
# files and command output, at the cost of more asks on normal work.
taint_sources: [web, mcp, tool, user_pasted, file, command]
