# llm-bouncer default policy. To customise, put only the keys you want to change in
# ~/.llm-bouncer/policy.yaml (or a file named by LLM_BOUNCER_POLICY). Top-level keys you set
# replace the default ones; keys you leave out keep their defaults.
# A policy file inside the project is ignored on purpose: a cloned repo could switch the gate off.

# Which labelled sources count as "tainted" for the ask rule.
# file and command output can also carry attacker text; add them for a stricter mode.
taint_sources: [web, mcp, tool, user_pasted]

# Risk categories that always ask, even in a session that read nothing untrusted.
always_ask_risks: [bouncer_tamper]

# What to do when a risky action echoes a URL, email or command that appeared in tainted text.
on_echo: deny        # deny | ask
# What to do when a risky action runs after tainted text was read in this session.
on_risky_after_taint: ask   # ask | deny | allow
# What to do with a call that is not risky but is not on the allowlist below (tainted sessions).
on_unlisted_after_taint: ask   # ask | deny | allow

# Risky Bash commands, by category (Python regex, case-insensitive).
bash_risky:
  download_and_execute:
    - '(curl|wget|fetch)\b[^;&]*\|\s*(sudo\s+(-\S+\s+)*)?(\S*/)?((ba|z|da|k|fi)?sh|python3?|perl|ruby|node)\b'
    - '\b((ba|z)?sh|source|\.)\s+<\('
    - '\b(python3?|node|perl|ruby)\s+-[ce]\b'
    - '\beval\s+["''$(`]'
    - 'base64\b[^|;&]*\s-(d|D|-decode)\b'
    - '\b(curl|wget)\b[^;&|]*&&\s*(ba|z)?sh\b'
  send_data_out:
    - 'curl\b.*\s(-[a-zA-Z]*[dFT]|--data\S*|--form\S*|--upload-file|--json)'
    - 'curl\b.*\s(-X|--request)\s*(POST|PUT|PATCH)'
    - 'wget\b.*--post'
    - '\b(nc|ncat|netcat|scp|sftp|rsync)\b'
  secrets:
    - '(\.env\b|id_rsa|id_ed25519|\.ssh/|\.aws/credentials|\.npmrc|\.netrc|\.git-credentials|\.pypirc)'
    - '\b(printenv|env)\b\s*($|\|)'
    - '\$\{?[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PASSWD|API_?KEY|PRIVATE_KEY)\b'
  publish:
    - '\bgit\b[^|;&\n]*\spush\b'
    - '\b(npm|pnpm|yarn)\b[^|;&\n]*\spublish\b'
    - '\btwine\s+upload\b'
    - '\bgh\s+(pr|release|repo|gist|issue)\s+(create|comment|edit|merge)\b'
    - '\bgh\s+api\b.*\s(-X|--method)\s*(POST|PUT|PATCH|DELETE)\b'
    - '\bgh\s+api\b.*\s(-f|-F|--field|--raw-field|--input)\b'
  destructive:
    - '\brm\b(?=[^|;&\n]*\s(-[a-zA-Z]*[rR]|--recursive))[^|;&\n]*\s(/|~/?|\$HOME/?|\*|\.\.?/?)(\s|$|\*)'
    - '\bchmod\s+(-R\s+)?777\b'
    - '\bsudo\b'

# Writing or editing these paths is risky (agent config, CI, shell startup, secrets).
# Also checked for Bash commands that write (>, >>, tee, cp, mv, sed -i, ...).
sensitive_paths:
  - '(^|/)\.env(\.|$)'
  - '(^|/)\.claude/'
  - '(^|/)\.claude\.json$'
  - '(^|/)\.mcp\.json$'
  - '(^|/)(CLAUDE|AGENTS)\.md$'
  - '(^|/)\.github/workflows/'
  - '(^|/)\.gitlab-ci\.yml$'
  - '(^|/)\.circleci/'
  - '(^|/)\.git/(hooks/|config$)'
  - '(^|/)\.vscode/(settings|tasks)\.json$'
  - '(^|/)\.(bashrc|zshrc|profile|bash_profile|zprofile|zshenv)$'
  - '(^|/)\.ssh/'
  - '(^|/)\.aws/'
  # Files that test and build commands execute automatically (npm scripts, pytest's conftest,
  # setup.py, Cargo build scripts, Makefiles). Editing them, then running an allowlisted
  # `npm test` or `pytest`, would otherwise run attacker code without a prompt.
  - '(^|/)(package\.json|conftest\.py|setup\.py|setup\.cfg|pyproject\.toml|tox\.ini|noxfile\.py|build\.rs|Cargo\.toml|Makefile|GNUmakefile|\.npmrc|\.yarnrc(\.yml)?|pytest\.ini)$'

# llm-bouncer's own ledger and policy. Touching them asks every time (see always_ask_risks).
bouncer_paths:
  - '\.llm-bouncer\b'
  - '\bLLM_BOUNCER_'
  - '\b(pip3?|pipx|uv|conda|python3?\s+-m\s+pip)\b.*\b(uninstall|remove)\b.*\bllm[-_]bouncer\b'
  # `llm-bouncer review` / `grant` clear taint or add capabilities: only the developer may do that.
  - '\bllm[-_]bouncer(\.hooks)?\s+(review|grant)\b'
  # Claude Code settings hold the hooks themselves: removing them switches the gate off.
  - '(^|[\s/''"=>])\.claude/settings(\.local)?\.json\b'
  - '(^|[\s/''"=>])\.claude\.json\b'

# Reading these paths is risky (secrets the agent could then send out).
secret_paths:
  - '(^|/)\.env(\.|$)'
  - '(^|/)\.ssh/'
  - '(^|/)\.aws/credentials$'
  - '(^|/)\.(npmrc|netrc|pypirc|git-credentials)$'

# MCP tools: a name is split into words (send_email, sendEmail -> send, email).
# It is risky if it contains a risky verb and does not START with a read-only verb.
mcp_readonly_verbs: [get, list, read, search, fetch, query, find, view, describe, show, lookup, retrieve, count, check, download]
mcp_risky_verbs: [send, post, create, delete, remove, update, write, push, merge, email, reply, forward, comment, publish, transfer, pay, share, invite, upload, execute, run, trigger, approve, close, archive, move, edit, set, add, assign, deploy]

# A fetched URL with a very long query string, query value or path segment may be smuggling data out.
max_fetch_query_chars: 120

# ---------------------------------------------------------------- after untrusted content
# The red-team showed a list of "risky" commands cannot keep up with a shell (quoting tricks,
# download-then-run, heredocs, git config, npm scripts...). So once the session has read untrusted
# content, it flips to an allowlist: Bash and MCP calls run silently only if they are known to be
# read-only or routine; anything else asks. Sessions that read nothing untrusted are unaffected.
tainted_mode: allowlist   # allowlist | denylist (denylist = only the risky rules above)

# Commands allowed as the first word of each part of a pipeline / && chain.
bash_safe_commands: [ls, pwd, cat, head, tail, wc, grep, egrep, fgrep, rg, find, echo, printf, which, type,
  file, stat, du, df, tree, sort, uniq, cut, tr, diff, cmp, date, whoami, basename, dirname, realpath,
  readlink, jq, true, false, test, pytest, ruff, mypy, black, isort, eslint, prettier, tsc]

# Allowed multi-word commands (matched on whole leading words).
bash_safe_prefixes: ["git status", "git diff", "git log", "git show", "git rev-parse", "git ls-files",
  "git blame", "git describe", "git shortlog", "git grep", "git branch", "git add", "git commit",
  "git stash", "git switch", "git checkout", "git restore", "git remote -v", "git tag -l",
  "python -m pytest", "python3 -m pytest", "python -m unittest", "python3 -m unittest",
  "python --version", "python3 --version", "node --version", "npm test", "npm run test", "npm run lint",
  "npm run build", "yarn test", "pnpm test", "go test", "go vet", "go build", "cargo test",
  "cargo check", "cargo build"]

# Arguments that turn an allowed command into one that writes, runs code or talks to the network.
bash_unsafe_args:
  find: [-exec, -execdir, -ok, -okdir, -delete, -fprint, -fprint0, -fprintf, -fls]
  sort: [-o, --output, --compress-program]
  git: [-c, --exec-path, --upload-pack, --receive-pack, --output, --ext-diff, -O, --open-files-in-pager, --config-env]
  rg: [--pre, --pre-glob]
  tree: [-o]
  date: [-s, --set]

# Ask when a fetched URL or search query carries something that looks like a secret.
secret_patterns:
  - '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
  - '\b(sk|pk|rk)-[A-Za-z0-9_-]{16,}'
  - '\bgh[pousr]_[A-Za-z0-9]{20,}'
  - '\bxox[abposr]-[A-Za-z0-9-]{10,}'
  - '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
  - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
min_secret_entropy: 3.5   # bits per char, for unknown tokens of 20+ chars mixing 3+ character classes

# ---------------------------------------------------------------- effects gate (v0.7)
# Instead of judging what a shell command *says*, let it run inside Claude Code's sandbox and
# mediate what it *does*: network egress (through `llm-bouncer proxy`), writes to files that run
# code later (snapshot, then revert), secret reads and external actions. After untrusted content
# an effect needs a capability: granted by your typed prompt (see intents) or `llm-bouncer grant`.
# auto: use the effects gate for Bash calls that run in the sandbox with llm-bouncer's proxy
# configured, and the command rules above for everything else. effects / commands force one.
gate: auto

egress:
  proxy_port: 18877          # set sandbox.network.httpProxyPort to this (`llm-bouncer setup`)
  session_window_minutes: 240   # sessions active this recently decide the proxy's policy
  always_allow: [localhost, 127.0.0.1, "::1"]   # never blocked
  always_deny: []            # blocked even in clean sessions
  grant_hours: 8             # default lifetime of `llm-bouncer grant` without --session

# Files that change what runs later (CI, builds, test setup, agent instructions). After untrusted
# content, a sandboxed Bash call that changes one of these without a write grant is reverted.
# Claude Code's sandbox already protects .claude/, .mcp.json, .git/hooks, .git/config and rc files.
integrity_paths: [".github/workflows/*", ".github/actions/*/action.y*ml", ".gitlab-ci.yml", ".circleci/config.yml",
  "package.json", ".npmrc", ".yarnrc", ".yarnrc.yml", "pyproject.toml", "setup.py", "setup.cfg", "conftest.py",
  "tests/conftest.py", "test/conftest.py", "pytest.ini", "tox.ini", "noxfile.py", "Makefile", "GNUmakefile",
  "Cargo.toml", "build.rs", ".cargo/config.toml", "Dockerfile", "docker-compose.yml", ".pre-commit-config.yaml",
  ".envrc", "CLAUDE.md", "AGENTS.md", ".cursorrules"]

# What a typed prompt grants. A URL or domain you type grants egress to its host; a file you name
# grants writing it. Words that match an intent grant its list. "@git-remotes" means the hosts of
# this repo's git remotes. Pasted prompts with hidden content grant nothing.
intents:
  - match: '\b(install|add(ing)?\s+(a\s+)?(dep|dependency|dependencies|package|library)|upgrade|bump|update\s+(the\s+)?(deps|dependencies|packages))\b'
    grants: [egress:pypi.org, egress:files.pythonhosted.org, egress:registry.npmjs.org, egress:registry.yarnpkg.com,
      egress:crates.io, egress:index.crates.io, egress:static.crates.io, egress:proxy.golang.org, egress:sum.golang.org,
      egress:rubygems.org, write:package.json, write:package-lock.json, write:yarn.lock, write:pnpm-lock.yaml,
      write:pyproject.toml, "write:requirements*.txt", write:poetry.lock, write:uv.lock, write:Cargo.toml,
      write:Cargo.lock, write:go.mod, write:go.sum, write:Gemfile, write:Gemfile.lock]
  - match: '\b(push|pull request|open\s+(a\s+)?pr|create\s+(a\s+)?pr|merge|release|tag)\b'
    grants: [egress:@git-remotes, egress:github.com, egress:api.github.com, egress:gitlab.com]
  - match: '\b(fetch|pull|clone|rebase on|sync with)\b'
    grants: [egress:@git-remotes]
  - match: '\b(ci|workflow|workflows|github actions|pipeline)\b'
    grants: ["write:.github/workflows/*", "write:.github/actions/*/action.y*ml", write:.gitlab-ci.yml, write:.circleci/config.yml]
  - match: '\b(makefile|dockerfile|docker|compose|pre-commit|test setup|conftest|tox|nox|build\s+(script|config|file|system))\b'
    grants: [write:Makefile, write:GNUmakefile, write:Dockerfile, write:docker-compose.yml, write:.pre-commit-config.yaml,
      write:conftest.py, write:tests/conftest.py, write:tox.ini, write:noxfile.py, write:pytest.ini, write:setup.cfg]
