[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bouncer"
version = "0.8.0"
description = "Text labelling for LLM agents: records where every piece of text an agent reads came from."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llm-bouncer = "llm_bouncer.hooks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_bouncer = ["policies/*.yaml", "evals/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
